baseURL = 'https://bibhasdn.com/'
locale = 'en-us'
title = 'Bibhas Debnath'
theme = 'github-style'
copyright = "© Bibhas D"

pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentsUseClasses = true
pygmentscodefencesguesssyntax = true

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["html", "rss", "json"]

[outputFormats.json]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = false

[params]
  author = "Bibhas Debnath"
  description = "0.10x engineer. And I'm bringing AI down to my level."
  github = "iambibhas"
  twitter = "bibhasdn"
  linkedin = "bibhasdn"
  url = "https://bibhasdn.com"
  location = "Bangalore"
  keywords = "blog"
  rss = true
  lastmod = false
  enableSearch = true
  enableGitalk = false
  favicon = "/images/profile.jpg"
  avatar = "/images/profile.jpg"
  headerIcon = "/images/github-mark-white.png"

  [[params.links]]
    title = "About"
    href = "/about/"

  [[params.links]]
    title = "Resume"
    href = "/resume/"

  [[params.links]]
    title = "Tags"
    href = "/tags/"

  [[params.links]]
    title = "Heritage Map"
    href = "/heritage-map/"

  [[params.links]]
    title = "Nearby Hospitals"
    href = "/nearby-hospitals/"

  [[params.links]]
    title = "Bangalore Durga Puja 2026 Map"
    href = "/puja-blr-2026/"

  [[params.links]]
    title = "Vande Bharat & Vistadome Map"
    href = "/train-to-take/"

  [[params.links]]
    title = "Earth Timeline"
    href = "/earth-timeline/"
